[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diel-engine"
version = "0.1.0"
description = "Platform-DIEL backtest engine (Fase 0): spec strategi -> metrik + equity curve forex yang reproducible"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
diel-engine = "diel_engine.cli:main"

[tool.setuptools.packages.find]
include = ["diel_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
